name = "hostfunc-email"
main = "src/index.ts"
compatibility_date = "2025-01-01"
compatibility_flags = ["nodejs_compat"]

[vars]
CONTROL_PLANE_URL = "http://localhost:3000"
CONTROL_PLANE_TOKEN = "dev-trigger-token"

# ──────────────────────────────────────────────────────────
# Staging
# Secrets via `wrangler secret put CONTROL_PLANE_TOKEN --env staging`
# (matches web TRIGGER_CONTROL_TOKEN).
# After deploy: add staging-mail.hostfunc.io as an Email Routing subdomain on the
# hostfunc.io zone with catch-all -> this worker (staging trigger addresses).
# ──────────────────────────────────────────────────────────
[env.staging]
name = "hostfunc-email-staging"

[env.staging.observability.logs]
enabled = false
invocation_logs = true

[env.staging.vars]
CONTROL_PLANE_URL = "https://staging.hostfunc.io"

# ──────────────────────────────────────────────────────────
# Production
# Secrets via `wrangler secret put CONTROL_PLANE_TOKEN --env production`.
# After deploy: enable Email Routing on the hostfunc.io zone (apex) and set the
# catch-all rule to send to this worker. Generated trigger addresses live at
# @hostfunc.io in production.
# ──────────────────────────────────────────────────────────
[env.production]
name = "hostfunc-email"

[env.production.observability.logs]
enabled = false
invocation_logs = true

[env.production.vars]
CONTROL_PLANE_URL = "https://app.hostfunc.io"
