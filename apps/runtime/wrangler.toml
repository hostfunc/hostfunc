name = "hostfunc-runtime"
main = "src/dispatch.ts"
compatibility_date = "2025-01-01"
compatibility_flags = ["nodejs_compat"]

# Top-level config = local dev (`wrangler dev --local`).
# Deployments must use `wrangler deploy --env staging|production`.
[vars]
ENV = "dev"
RUNTIME_INVOKE_TOKEN = "dev-runtime-invoke-token"

[[kv_namespaces]]
binding = "FN_INDEX"
id = "local-fn-index"

[[kv_namespaces]]
binding = "EGRESS_COUNTERS"
id = "local-egress-counters"

# Custom-domain hostname -> { orgSlug, fnSlug } index (Cloudflare for SaaS).
[[kv_namespaces]]
binding = "DOMAIN_INDEX"
id = "local-domain-index"

[[dispatch_namespaces]]
binding = "DISPATCHER"
namespace = "hostfunc-dev"

# ──────────────────────────────────────────────────────────
# Staging
# Secrets to set via `wrangler secret put <NAME> --env staging`:
#   - LOOKUP_API_TOKEN       (matches web RUNTIME_LOOKUP_TOKEN)
#   - RUNTIME_INVOKE_TOKEN   (matches web RUNTIME_INVOKE_TOKEN, cron worker)
# ──────────────────────────────────────────────────────────
[env.staging]
name = "hostfunc-runtime-staging"
routes = [
  { pattern = "staging-run.hostfunc.io/*", zone_name = "hostfunc.io" },
  # Custom domains (Cloudflare for SaaS). Onboarded custom hostnames in the SaaS
  # zone hit this `*/*` route. Uncomment once a staging SaaS zone is entitled.
  # { pattern = "*/*", zone_name = "staging.hostfunc.app" },
]

[env.staging.observability.logs]
enabled = false
invocation_logs = true

[env.staging.vars]
ENV = "staging"
WORKERS_SUBDOMAIN = "staging-run.hostfunc.io"
LOOKUP_API_URL = "https://staging.hostfunc.io"
RUNTIME_PUBLIC_URL = "https://staging-run.hostfunc.io"
# Keep this key present at env scope to avoid non-inherited top-level vars warning.
# Real value should still be managed as a Wrangler secret for staging.
RUNTIME_INVOKE_TOKEN = "set-via-wrangler-secret"

[[env.staging.kv_namespaces]]
binding = "FN_INDEX"
id = "5c711a85eb2744c6b0712693151485e5"

[[env.staging.kv_namespaces]]
binding = "EGRESS_COUNTERS"
id = "d31c8394b3fe477f910b3782f5d8f5f0"

[[env.staging.kv_namespaces]]
binding = "DOMAIN_INDEX"
id = "1f4883ca6f8a4dfbbd2cd916677dee5e"

[[env.staging.dispatch_namespaces]]
binding = "DISPATCHER"
namespace = "hostfunc-staging"

# ──────────────────────────────────────────────────────────
# Production
# Secrets to set via `wrangler secret put <NAME> --env production`:
#   - LOOKUP_API_TOKEN
#   - RUNTIME_INVOKE_TOKEN
# ──────────────────────────────────────────────────────────
[env.production]
name = "hostfunc-runtime"
routes = [
  { pattern = "run.hostfunc.io/*", zone_name = "hostfunc.io" },
  # Custom domains (Cloudflare for SaaS) deferred: the hostfunc.app SaaS zone is
  # not registered. Re-add `{ pattern = "*/*", zone_name = "hostfunc.app" }` here
  # (and set the CF_SAAS_* web env vars) once that zone exists in Cloudflare.
]

[env.production.observability.logs]
enabled = false
invocation_logs = true

[env.production.vars]
ENV = "production"
WORKERS_SUBDOMAIN = "run.hostfunc.io"
LOOKUP_API_URL = "https://app.hostfunc.io"
RUNTIME_PUBLIC_URL = "https://run.hostfunc.io"

[[env.production.kv_namespaces]]
binding = "FN_INDEX"
id = "1485d5a4c83f4285a729ade689fe9644"

[[env.production.kv_namespaces]]
binding = "EGRESS_COUNTERS"
id = "6d03603b852f44cb98cf905893efb489"

[[env.production.kv_namespaces]]
binding = "DOMAIN_INDEX"
id = "bed702dfef904483b461addf02b6cba3"

[[env.production.dispatch_namespaces]]
binding = "DISPATCHER"
namespace = "hostfunc-prod"
