name: Secret Scan

# Pattern A guard-rail: block any PR (or push) that introduces a real secret.
# Real secrets must live only in GitHub Environments, Vercel project env vars,
# or `wrangler secret put` — never in this repo.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: secret-scan-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gitleaks:
    name: gitleaks
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@v4
        with:
          # gitleaks needs full history to scan diffs on PRs.
          fetch-depth: 0

      # Use OSS gitleaks binary directly to avoid org-license requirements
      # from gitleaks-action@v2.
      - name: Install gitleaks (OSS CLI)
        run: |
          curl -sSfL https://raw.githubusercontent.com/gitleaks/gitleaks/master/install.sh \
            | sh -s -- -b /usr/local/bin v8.23.3

      - name: Run gitleaks
        run: gitleaks detect --no-git=false --redact --config .gitleaks.toml
