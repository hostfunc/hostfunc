name: Secret Scan

# Pattern A guard-rail: block any PR (or push) that introduces a real secret.
# Real secrets must live only in GitHub Environments, Vercel project env vars,
# or `wrangler secret put` — never in this repo.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: secret-scan-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gitleaks:
    name: gitleaks
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@v4
        with:
          # gitleaks needs full history to scan diffs on PRs.
          fetch-depth: 0

      # Install the OSS CLI from a pinned GitHub release artifact.
      - name: Install gitleaks (OSS CLI)
        run: |
          VERSION=8.24.2
          curl -sSfL "https://github.com/gitleaks/gitleaks/releases/download/v${VERSION}/gitleaks_${VERSION}_linux_x64.tar.gz" \
            -o /tmp/gitleaks.tar.gz
          tar -xzf /tmp/gitleaks.tar.gz -C /tmp gitleaks
          install -m 0755 /tmp/gitleaks /usr/local/bin/gitleaks
          gitleaks version

      - name: Run gitleaks
        run: gitleaks detect --no-git=false --redact --config .gitleaks.toml
