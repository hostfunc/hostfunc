name: Secret Scan

# Pattern A guard-rail: block any PR (or push) that introduces a real secret.
# Real secrets must live only in GitHub Environments, Vercel project env vars,
# or `wrangler secret put` — never in this repo.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: secret-scan-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gitleaks:
    name: gitleaks
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@v4
        with:
          # gitleaks needs full history to scan diffs on PRs.
          fetch-depth: 0
      - name: Run gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Use the in-repo config so contributors and CI agree on rules + allowlist.
          GITLEAKS_CONFIG: .gitleaks.toml
